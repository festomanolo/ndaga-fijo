[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndaga-fijo"
version = "1.0.0"
description = "Create bootable USB drives on macOS from ISO and disk images: fast, safe, and Windows-ready. Based on Rufus."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "festomanolo" }]
keywords = ["bootable usb", "usb creator", "iso", "macos", "rufus", "windows installer", "flash", "balena etcher alternative"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: System :: Installation/Setup",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://festomanolo.com/ndaga-fijo/"
Source = "https://github.com/festomanolo/ndaga-fijo"
Issues = "https://github.com/festomanolo/ndaga-fijo/issues"

[project.scripts]
ndaga-fijo = "ndaga_fijo.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["ndaga_fijo"]
include-package-data = true

[tool.setuptools.package-data]
ndaga_fijo = ["NdagaFijo.app/**/*", "NdagaFijo.app/**/.*"]
